<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<title>BlitzMeister</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<style>
:root{
  --bg:#F1EFE5;
  --card:#FFFFFF;
  --card-border:#E4E0D2;
  --green:#5B7F4A;
  --green-dark:#456238;
  --green-soft:#EAF0E1;
  --green-softer:#F4F7EF;
  --ink:#20241A;
  --ink-muted:#767E6C;
  --ink-faint:#A6AC9C;
  --board-light:#EDECD3;
  --board-dark:#77945F;
  --board-light-hi:#F4EE9C;
  --board-dark-hi:#BACB5A;
  --red:#C24F3D;
  --red-soft:#FBEBE7;
  --amber:#C9902E;
  --amber-soft:#FBF1E1;
  --radius-lg:22px;
  --radius-md:16px;
  --radius-sm:11px;
  --shadow:0 2px 14px rgba(30,35,20,0.07);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font);height:100%;overscroll-behavior-y:none;}
body{-webkit-font-smoothing:antialiased;}
button{font-family:inherit;}
input,textarea{font-family:inherit;}
.hidden{display:none !important;}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(28px + var(--safe-bottom));display:flex;flex-direction:column;}

/* ---------- Header ---------- */
.topbar{padding:calc(16px + var(--safe-top)) 20px 10px;display:flex;align-items:center;gap:10px;}
.brand{display:flex;align-items:center;gap:9px;font-size:27px;font-weight:800;letter-spacing:-0.02em;}
.brand .pawn{font-size:25px;line-height:1;}
.brand-word{display:inline-flex;}
.brand .blitz{color:var(--ink);}
.brand .meister{color:var(--green);}

/* ---------- Buttons ---------- */
.btn{
  border:1px solid var(--card-border);background:var(--card);color:var(--ink);
  border-radius:999px;padding:13px 18px;font-size:15.5px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  cursor:pointer;user-select:none;transition:transform .08s ease, opacity .12s ease;
}
.btn:active{transform:scale(0.96);opacity:.85;}
.btn-primary{background:var(--green);border-color:var(--green);color:#fff;}
.btn-block{width:100%;}
.btn-sm{padding:9px 14px;font-size:14px;}
.btn-icon{width:44px;height:44px;padding:0;border-radius:14px;flex:none;font-size:18px;}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-muted);}
.btn-danger{color:var(--red);}
.row-gap{display:flex;gap:10px;}
.row-gap > .btn{flex:1;min-width:0;}

/* ---------- Library ---------- */
.section-pad{padding:0 20px;}
.subtitle{color:var(--ink-muted);font-size:14.5px;margin:0 0 18px;}
.lib-actions{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
.opening-list{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
.opening-card{
  background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius-md);
  padding:14px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);cursor:pointer;
}
.opening-card:active{transform:scale(0.99);}
.opening-card .oc-icon{
  width:44px;height:44px;border-radius:12px;background:var(--green-soft);color:var(--green-dark);
  display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;
}
.opening-card .oc-main{flex:1;min-width:0;}
.opening-card .oc-name{font-weight:700;font-size:16px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.opening-card .oc-meta{font-size:13px;color:var(--ink-muted);display:flex;gap:8px;align-items:center;}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--green-soft);color:var(--green-dark);}
.badge.black{background:#26281F;color:#fff;}
.oc-menu-btn{background:transparent;border:none;color:var(--ink-faint);font-size:20px;padding:6px 4px;cursor:pointer;flex:none;}
.empty-state{text-align:center;padding:50px 20px;color:var(--ink-muted);}
.empty-state .es-icon{font-size:42px;margin-bottom:10px;}

/* ---------- Card / Info panel ---------- */
.info-card{
  background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius-lg);
  padding:20px;margin:0 20px 16px;box-shadow:var(--shadow);transition:background .3s ease;
}
.info-card.info-card-complete{background:var(--green);border-color:var(--green);}
.info-card.info-card-complete .info-title{color:#fff;}
.info-card.info-card-complete .info-text{color:rgba(255,255,255,0.92);}
.info-card.info-card-complete .progressbar{background:rgba(255,255,255,0.32);}
.info-card-next-row{display:flex;justify-content:flex-end;margin-top:14px;}
.btn-next-arrow{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,0.22);border:none;color:#fff;font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s ease;}
.btn-next-arrow:active{background:rgba(255,255,255,0.4);}
.info-title{font-weight:800;font-size:18px;margin:0 0 6px;}
.info-text{color:var(--ink-muted);font-size:14.5px;line-height:1.45;margin:0 0 14px;}
.progressbar{height:7px;background:var(--card-border);border-radius:99px;overflow:hidden;margin-bottom:8px;}
.progressbar > div{height:100%;background:var(--ink-faint);border-radius:99px;transition:width .25s ease, background .25s ease;}
.progressbar > div.complete{background:#fff;}
.progress-label{font-size:12.5px;color:var(--ink-muted);text-align:right;margin-bottom:14px;}

/* ---------- Trainer top ---------- */
.trainer-top{display:flex;align-items:center;gap:10px;padding:calc(14px + var(--safe-top)) 20px 4px;}
.trainer-title{flex:1;min-width:0;font-weight:800;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mode-toggle{display:flex;background:var(--green-soft);border-radius:999px;padding:4px;margin:10px 20px 14px;}
.practice-all-bar{display:flex;align-items:center;justify-content:space-between;background:var(--green);color:#fff;border-radius:999px;padding:10px 8px 10px 18px;margin:10px 20px 14px;font-weight:700;font-size:14.5px;}
.mode-toggle button{flex:1;border:none;background:transparent;padding:10px 0;border-radius:999px;font-weight:700;font-size:14.5px;color:var(--green-dark);cursor:pointer;}
.mode-toggle button.active{background:var(--green);color:#fff;}

/* ---------- Board ---------- */
.board-wrap{padding:0 16px;margin-bottom:14px;}
.eval-bar-wrap{width:100%;height:22px;margin:2px 0 14px;border-radius:7px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--card-border);display:flex;flex-direction:row;position:relative;}
.eval-bar-white{background:#F7F6EF;transition:flex-grow .4s ease;}
.eval-bar-black{background:#20241A;transition:flex-grow .4s ease;}
.eval-bar-score{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:11px;font-weight:800;color:var(--ink);text-shadow:0 0 4px #fff, 0 0 4px #fff, 0 0 4px #fff;letter-spacing:-0.02em;white-space:nowrap;}
.board{
  width:100%;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
  border-radius:14px;overflow:hidden;box-shadow:var(--shadow);position:relative;touch-action:none;
}
.square{position:relative;display:flex;align-items:center;justify-content:center;}
.square.light{background:var(--board-light);}
.square.dark{background:var(--board-dark);}
.square.hi-from{background:var(--board-light-hi) !important;}
.square.hi-to{background:var(--board-light-hi) !important;}
.square.dark.hi-from,.square.dark.hi-to{background:var(--board-dark-hi) !important;}
.square .coord{position:absolute;font-size:9.5px;font-weight:700;opacity:.55;top:2px;left:3px;}
.square.light .coord{color:var(--board-dark);}
.square.dark .coord{color:var(--board-light);}
.square .coord.rank{top:auto;left:auto;bottom:2px;right:3px;}
.dot{width:26%;height:26%;border-radius:50%;background:rgba(30,35,20,0.28);position:absolute;pointer-events:none;}
.dot.capture{width:100%;height:100%;border-radius:0;background:transparent;box-shadow:inset 0 0 0 4px rgba(30,35,20,0.28);position:absolute;pointer-events:none;}
.piece{width:min(11.4vw,54px);height:min(11.4vw,54px);display:flex;align-items:center;justify-content:center;user-select:none;cursor:grab;position:relative;z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));}
.piece-svg{width:86%;height:86%;overflow:visible;}
.piece.white .piece-svg{fill:#FFFFFF;stroke:#2B2F22;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;}
.piece.black .piece-svg{fill:#14150E;stroke:#14150E;stroke-width:0.6;stroke-linejoin:round;}
.piece.dragging{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%);cursor:grabbing;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3));}
.flash-correct{animation:flashGreen .5s ease;}
.flash-incorrect{animation:flashRed .5s ease;}
@keyframes flashGreen{0%{background:#8FCB7A !important;}100%{}}
@keyframes flashRed{0%{background:#E48E7F !important;}100%{}}

/* ---------- Action rows ---------- */
.actions-row{padding:0 20px;display:flex;gap:10px;margin-bottom:12px;}
.color-pick{display:flex;gap:10px;margin-bottom:6px;}
.color-pick .btn{flex:1;}
.color-pick .btn.selected{background:var(--green);border-color:var(--green);color:#fff;}

/* ---------- Stats ---------- */
.stats-row{display:flex;gap:10px;padding:0 20px;margin-bottom:16px;}
.stat-box{flex:1;background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius-md);padding:14px;text-align:center;}
.stat-box .num{font-size:22px;font-weight:800;}
.stat-box.correct .num{color:var(--green);}
.stat-box.incorrect .num{color:var(--red);}
.stat-box .lbl{font-size:12px;color:var(--ink-muted);margin-top:2px;}

/* ---------- Moves table ---------- */
.moves-section{margin:0 20px 16px;background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow);}
.moves-header{padding:15px 18px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-weight:800;letter-spacing:.03em;font-size:13px;color:var(--ink-muted);text-transform:uppercase;}
.moves-header .chev{transition:transform .2s ease;color:var(--ink-faint);}
.moves-header.open .chev{transform:rotate(180deg);}
.moves-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
.moves-body.open{max-height:340px;overflow-y:auto;}
.moves-body-inner{padding:0 18px 16px;font-size:15px;line-height:1.85;word-break:break-word;}
.mv{cursor:pointer;padding:1px 3px;border-radius:5px;color:var(--ink);}
.mv:hover{background:var(--green-soft);}
.mv.current{background:var(--green);color:#fff;font-weight:700;}
.mv.mv-black{font-weight:700;}
.mv-group{display:inline-flex;align-items:center;gap:1px;}
.mv-comment-icon{font-size:11px;opacity:.28;cursor:pointer;padding:0 3px;filter:grayscale(1);}
.mv-comment-icon.has-comment{opacity:1;filter:none;}
.mv-num{color:var(--ink-faint);margin-right:2px;}
.variation{color:var(--ink-muted);font-size:14px;}
.no-moves{color:var(--ink-faint);font-size:14px;padding:2px 0;}

/* ---------- Modal ---------- */
/* ---------- Library drawer ---------- */
.drawer-overlay{position:fixed;inset:0;background:rgba(20,22,15,0);z-index:900;display:flex;align-items:stretch;justify-content:flex-start;transition:background .28s ease;}
.drawer-overlay.open{background:rgba(20,22,15,0.45);}
.drawer-panel{width:min(86vw,380px);max-width:380px;height:100%;background:var(--bg);box-shadow:2px 0 24px rgba(0,0,0,0.18);transform:translateX(-100%);transition:transform .28s ease;overflow-y:auto;padding-bottom:24px;}
.drawer-overlay.open .drawer-panel{transform:translateX(0);}
.drawer-close{margin-left:auto;}

.modal-overlay{position:fixed;inset:0;background:rgba(20,22,15,0.45);display:flex;align-items:flex-end;justify-content:center;z-index:1000;}
.modal-overlay.center{align-items:center;padding:20px;}
.modal-sheet{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + var(--safe-bottom));max-height:85vh;overflow-y:auto;}
.modal-overlay.center .modal-sheet{border-radius:22px;max-height:80vh;}
.modal-title{font-size:19px;font-weight:800;margin:0 0 14px;}
.field-label{font-size:13px;font-weight:700;color:var(--ink-muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.03em;}
.field-label:first-of-type{margin-top:0;}
.text-input{width:100%;padding:13px 14px;border:1px solid var(--card-border);border-radius:12px;font-size:16px;background:var(--green-softer);color:var(--ink);}
textarea.text-input{resize:vertical;min-height:110px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.modal-close{position:absolute;top:14px;right:16px;}
.modal-tabs{display:flex;background:var(--green-soft);border-radius:999px;padding:4px;margin-bottom:16px;}
.modal-tabs button{flex:1;border:none;background:transparent;padding:9px 0;border-radius:999px;font-weight:700;font-size:14px;color:var(--green-dark);cursor:pointer;}
.modal-tabs button.active{background:var(--green);color:#fff;}
.promo-choices{display:flex;gap:10px;justify-content:center;padding:8px 0;}
.promo-choices button{width:64px;height:64px;border-radius:14px;border:1px solid var(--card-border);background:var(--green-softer);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.toast{position:fixed;bottom:calc(24px + var(--safe-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;z-index:2000;box-shadow:0 4px 16px rgba(0,0,0,.25);}
</style>

    a3:  80, b3:  81, c3:  82, d3:  83, e3:  84, f3:  85, g3:  86, h3:  87,
    a2:  96, b2:  97, c2:  98, d2:  99, e2: 100, f2: 101, g2: 102, h2: 103,
    a1: 112, b1: 113, c1: 114, d1: 115, e1: 116, f1: 117, g1: 118, h1: 119
  };

  var ROOKS = {
    w: [
      { square: SQUARES.a1, flag: BITS.QSIDE_CASTLE },
      { square: SQUARES.h1, flag: BITS.KSIDE_CASTLE }
    ],
    b: [
      { square: SQUARES.a8, flag: BITS.QSIDE_CASTLE },
      { square: SQUARES.h8, flag: BITS.KSIDE_CASTLE }
    ]
  }

  var board = new Array(128)
  var kings = { w: EMPTY, b: EMPTY }
  var turn = WHITE
  var castling = { w: 0, b: 0 }
  var ep_square = EMPTY
  var half_moves = 0
  var move_number = 1
  var history = []
  var header = {}

  /* if the user passes in a fen string, load it, else default to
   * starting position
   */
  if (typeof fen === 'undefined') {
    load(DEFAULT_POSITION)
  } else {
    load(fen)
  }

  function clear(keep_headers) {
    if (typeof keep_headers === 'undefined') {
      keep_headers = false
    }

    board = new Array(128)
    kings = { w: EMPTY, b: EMPTY }
    turn = WHITE
    castling = { w: 0, b: 0 }
    ep_square = EMPTY
    half_moves = 0
    move_number = 1
    history = []
    if (!keep_headers) header = {}
    update_setup(generate_fen())
  }

  function reset() {
    load(DEFAULT_POSITION)
  }

  function load(fen, keep_headers) {
    if (typeof keep_headers === 'undefined') {
      keep_headers = false
    }

    var tokens = fen.split(/\s+/)
    var position = tokens[0]
    var square = 0

    if (!validate_fen(fen).valid) {
      return false
    }

    clear(keep_headers)

    for (var i = 0; i < position.length; i++) {
      var piece = position.charAt(i)

      if (piece === '/') {
        square += 8
      } else if (is_digit(piece)) {
        square += parseInt(piece, 10)
      } else {
        var color = piece < 'a' ? WHITE : BLACK
        put({ type: piece.toLowerCase(), color: color }, algebraic(square))
        square++
      }
    }

    turn = tokens[1]

    if (tokens[2].indexOf('K') > -1) {
      castling.w |= BITS.KSIDE_CASTLE
    }
    if (tokens[2].indexOf('Q') > -1) {
      castling.w |= BITS.QSIDE_CASTLE
    }
    if (tokens[2].indexOf('k') > -1) {
      castling.b |= BITS.KSIDE_CASTLE
    }
    if (tokens[2].indexOf('q') > -1) {
      castling.b |= BITS.QSIDE_CASTLE
    }

    ep_square = tokens[3] === '-' ? EMPTY : SQUARES[tokens[3]]
    half_moves = parseInt(tokens[4], 10)
    move_number = parseInt(tokens[5], 10)

    update_setup(generate_fen())

    return true
  }

  /* TODO: this function is pretty much crap - it validates structure but
   * completely ignores content (e.g. doesn't verify that each side has a king)
   * ... we should rewrite this, and ditch the silly error_number field while
   * we're at it
   */
  function validate_fen(fen) {
    var errors = {
      0: 'No errors.',
      1: 'FEN string must contain six space-delimited fields.',
      2: '6th field (move number) must be a positive integer.',
      3: '5th field (half move counter) must be a non-negative integer.',
      4: '4th field (en-passant square) is invalid.',
      5: '3rd field (castling availability) is invalid.',
      6: '2nd field (side to move) is invalid.',
      7: "1st field (piece positions) does not contain 8 '/'-delimited rows.",
      8: '1st field (piece positions) is invalid [consecutive numbers].',
      9: '1st field (piece positions) is invalid [invalid piece].',
      10: '1st field (piece positions) is invalid [row too large].',
      11: 'Illegal en-passant square'
    }

    /* 1st criterion: 6 space-seperated fields? */
    var tokens = fen.split(/\s+/)
    if (tokens.length !== 6) {
      return { valid: false, error_number: 1, error: errors[1] }
    }

    /* 2nd criterion: move number field is a integer value > 0? */
    if (isNaN(tokens[5]) || parseInt(tokens[5], 10) <= 0) {
      return { valid: false, error_number: 2, error: errors[2] }
    }

    /* 3rd criterion: half move counter is an integer >= 0? */
    if (isNaN(tokens[4]) || parseInt(tokens[4], 10) < 0) {
      return { valid: false, error_number: 3, error: errors[3] }
    }

    /* 4th criterion: 4th field is a valid e.p.-string? */
    if (!/^(-|[abcdefgh][36])$/.test(tokens[3])) {
      return { valid: false, error_number: 4, error: errors[4] }
    }

    /* 5th criterion: 3th field is a valid castle-string? */
    if (!/^(KQ?k?q?|Qk?q?|kq?|q|-)$/.test(tokens[2])) {
      return { valid: false, error_number: 5, error: errors[5] }
    }

    /* 6th criterion: 2nd field is "w" (white) or "b" (black)? */
    if (!/^(w|b)$/.test(tokens[1])) {
      return { valid: false, error_number: 6, error: errors[6] }
    }

    /* 7th criterion: 1st field contains 8 rows? */
    var rows = tokens[0].split('/')
    if (rows.length !== 8) {
      return { valid: false, error_number: 7, error: errors[7] }
    }

    /* 8th criterion: every row is valid? */
    for (var i = 0; i < rows.length; i++) {
      /* check for right sum of fields AND not two numbers in succession */
      var sum_fields = 0
      var previous_was_number = false

      for (var k = 0; k < rows[i].length; k++) {
        if (!isNaN(rows[i][k])) {
          if (previous_was_number) {
            return { valid: false, error_number: 8, error: errors[8] }
          }
          sum_fields += parseInt(rows[i][k], 10)
          previous_was_number = true
        } else {
          if (!/^[prnbqkPRNBQK]$/.test(rows[i][k])) {
            return { valid: false, error_number: 9, error: errors[9] }
          }
          sum_fields += 1
          previous_was_number = false
        }
      }
      if (sum_fields !== 8) {
        return { valid: false, error_number: 10, error: errors[10] }
      }
    }

    if (
      (tokens[3][1] == '3' && tokens[1] == 'w') ||
      (tokens[3][1] == '6' && tokens[1] == 'b')
    ) {
      return { valid: false, error_number: 11, error: errors[11] }
    }

    /* everything's okay! */
    return { valid: true, error_number: 0, error: errors[0] }
  }

  function generate_fen() {
    var empty = 0
    var fen = ''

    for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
      if (board[i] == null) {
        empty++
      } else {
        if (empty > 0) {
          fen += empty
          empty = 0
        }
        var color = board[i].color
        var piece = board[i].type

        fen += color === WHITE ? piece.toUpperCase() : piece.toLowerCase()
      }

      if ((i + 1) & 0x88) {
        if (empty > 0) {
          fen += empty
        }

        if (i !== SQUARES.h1) {
          fen += '/'
        }

        empty = 0
        i += 8
      }
    }

    var cflags = ''
    if (castling[WHITE] & BITS.KSIDE_CASTLE) {
      cflags += 'K'
    }
    if (castling[WHITE] & BITS.QSIDE_CASTLE) {
      cflags += 'Q'
    }
    if (castling[BLACK] & BITS.KSIDE_CASTLE) {
      cflags += 'k'
    }
    if (castling[BLACK] & BITS.QSIDE_CASTLE) {
      cflags += 'q'
    }

    /* do we have an empty castling flag? */
    cflags = cflags || '-'
    var epflags = ep_square === EMPTY ? '-' : algebraic(ep_square)

    return [fen, turn, cflags, epflags, half_moves, move_number].join(' ')
  }

  function set_header(args) {
    for (var i = 0; i < args.length; i += 2) {
      if (typeof args[i] === 'string' && typeof args[i + 1] === 'string') {
        header[args[i]] = args[i + 1]
      }
    }
    return header
  }

  /* called when the initial board setup is changed with put() or remove().
   * modifies the SetUp and FEN properties of the header object.  if the FEN is
   * equal to the default position, the SetUp and FEN are deleted
   * the setup is only updated if history.length is zero, ie moves haven't been
   * made.
   */
  function update_setup(fen) {
    if (history.length > 0) return

    if (fen !== DEFAULT_POSITION) {
      header['SetUp'] = '1'
      header['FEN'] = fen
    } else {
      delete header['SetUp']
      delete header['FEN']
    }
  }

  function get(square) {
    var piece = board[SQUARES[square]]
    return piece ? { type: piece.type, color: piece.color } : null
  }

  function put(piece, square) {
    /* check for valid piece object */
    if (!('type' in piece && 'color' in piece)) {
      return false
    }

    /* check for piece */
    if (SYMBOLS.indexOf(piece.type.toLowerCase()) === -1) {
      return false
    }

    /* check for valid square */
    if (!(square in SQUARES)) {
      return false
    }

    var sq = SQUARES[square]

    /* don't let the user place more than one king */
    if (
      piece.type == KING &&
      !(kings[piece.color] == EMPTY || kings[piece.color] == sq)
    ) {
      return false
    }

    board[sq] = { type: piece.type, color: piece.color }
    if (piece.type === KING) {
      kings[piece.color] = sq
    }

    update_setup(generate_fen())

    return true
  }

  function remove(square) {
    var piece = get(square)
    board[SQUARES[square]] = null
    if (piece && piece.type === KING) {
      kings[piece.color] = EMPTY
    }

    update_setup(generate_fen())

    return piece
  }

  function build_move(board, from, to, flags, promotion) {
    var move = {
      color: turn,
      from: from,
      to: to,
      flags: flags,
      piece: board[from].type
    }

    if (promotion) {
      move.flags |= BITS.PROMOTION
      move.promotion = promotion
    }

    if (board[to]) {
      move.captured = board[to].type
    } else if (flags & BITS.EP_CAPTURE) {
      move.captured = PAWN
    }
    return move
  }

  function generate_moves(options) {
    function add_move(board, moves, from, to, flags) {
      /* if pawn promotion */
      if (
        board[from].type === PAWN &&
        (rank(to) === RANK_8 || rank(to) === RANK_1)
      ) {
        var pieces = [QUEEN, ROOK, BISHOP, KNIGHT]
        for (var i = 0, len = pieces.length; i < len; i++) {
          moves.push(build_move(board, from, to, flags, pieces[i]))
        }
      } else {
        moves.push(build_move(board, from, to, flags))
      }
    }

    var moves = []
    var us = turn
    var them = swap_color(us)
    var second_rank = { b: RANK_7, w: RANK_2 }

    var first_sq = SQUARES.a8
    var last_sq = SQUARES.h1
    var single_square = false

    /* do we want legal moves? */
    var legal =
      typeof options !== 'undefined' && 'legal' in options
        ? options.legal
        : true

    /* are we generating moves for a single square? */
    if (typeof options !== 'undefined' && 'square' in options) {
      if (options.square in SQUARES) {
        first_sq = last_sq = SQUARES[options.square]
        single_square = true
      } else {
        /* invalid square */
        return []
      }
    }

    for (var i = first_sq; i <= last_sq; i++) {
      /* did we run off the end of the board */
      if (i & 0x88) {
        i += 7
        continue
      }

      var piece = board[i]
      if (piece == null || piece.color !== us) {
        continue
      }

      if (piece.type === PAWN) {
        /* single square, non-capturing */
        var square = i + PAWN_OFFSETS[us][0]
        if (board[square] == null) {
          add_move(board, moves, i, square, BITS.NORMAL)

          /* double square */
          var square = i + PAWN_OFFSETS[us][1]
          if (second_rank[us] === rank(i) && board[square] == null) {
            add_move(board, moves, i, square, BITS.BIG_PAWN)
          }
        }

        /* pawn captures */
        for (j = 2; j < 4; j++) {
          var square = i + PAWN_OFFSETS[us][j]
          if (square & 0x88) continue

          if (board[square] != null && board[square].color === them) {
            add_move(board, moves, i, square, BITS.CAPTURE)
          } else if (square === ep_square) {
            add_move(board, moves, i, ep_square, BITS.EP_CAPTURE)
          }
        }
      } else {
        for (var j = 0, len = PIECE_OFFSETS[piece.type].length; j < len; j++) {
          var offset = PIECE_OFFSETS[piece.type][j]
          var square = i

          while (true) {
            square += offset
            if (square & 0x88) break

            if (board[square] == null) {
              add_move(board, moves, i, square, BITS.NORMAL)
            } else {
              if (board[square].color === us) break
              add_move(board, moves, i, square, BITS.CAPTURE)
              break
            }

            /* break, if knight or king */
            if (piece.type === 'n' || piece.type === 'k') break
          }
        }
      }
    }

    /* check for castling if: a) we're generating all moves, or b) we're doing
     * single square move generation on the king's square
     */
    if (!single_square || last_sq === kings[us]) {
      /* king-side castling */
      if (castling[us] & BITS.KSIDE_CASTLE) {
        var castling_from = kings[us]
        var castling_to = castling_from + 2

        if (
          board[castling_from + 1] == null &&
          board[castling_to] == null &&
          !attacked(them, kings[us]) &&
          !attacked(them, castling_from + 1) &&
          !attacked(them, castling_to)
        ) {
          add_move(board, moves, kings[us], castling_to, BITS.KSIDE_CASTLE)
        }
      }

      /* queen-side castling */
      if (castling[us] & BITS.QSIDE_CASTLE) {
        var castling_from = kings[us]
        var castling_to = castling_from - 2

        if (
          board[castling_from - 1] == null &&
          board[castling_from - 2] == null &&
          board[castling_from - 3] == null &&
          !attacked(them, kings[us]) &&
          !attacked(them, castling_from - 1) &&
          !attacked(them, castling_to)
        ) {
          add_move(board, moves, kings[us], castling_to, BITS.QSIDE_CASTLE)
        }
      }
    }

    /* return all pseudo-legal moves (this includes moves that allow the king
     * to be captured)
     */
    if (!legal) {
      return moves
    }

    /* filter out illegal moves */
    var legal_moves = []
    for (var i = 0, len = moves.length; i < len; i++) {
      make_move(moves[i])
      if (!king_attacked(us)) {
        legal_moves.push(moves[i])
      }
      undo_move()
    }

    return legal_moves
  }

  /* convert a move from 0x88 coordinates to Standard Algebraic Notation
   * (SAN)
   *
   * @param {boolean} sloppy Use the sloppy SAN generator to work around over
   * disambiguation bugs in Fritz and Chessbase.  See below:
   *
   * r1bqkbnr/ppp2ppp/2n5/1B1pP3/4P3/8/PPPP2PP/RNBQK1NR b KQkq - 2 4
   * 4. ... Nge7 is overly disambiguated because the knight on c6 is pinned
   * 4. ... Ne7 is technically the valid SAN
   */
  function move_to_san(move, sloppy) {
    var output = ''

    if (move.flags & BITS.KSIDE_CASTLE) {
      output = 'O-O'
    } else if (move.flags & BITS.QSIDE_CASTLE) {
      output = 'O-O-O'
    } else {
      var disambiguator = get_disambiguator(move, sloppy)

      if (move.piece !== PAWN) {
        output += move.piece.toUpperCase() + disambiguator
      }

      if (move.flags & (BITS.CAPTURE | BITS.EP_CAPTURE)) {
        if (move.piece === PAWN) {
          output += algebraic(move.from)[0]
        }
        output += 'x'
      }

      output += algebraic(move.to)

      if (move.flags & BITS.PROMOTION) {
        output += '=' + move.promotion.toUpperCase()
      }
    }

    make_move(move)
    if (in_check()) {
      if (in_checkmate()) {
        output += '#'
      } else {
        output += '+'
      }
    }
    undo_move()

    return output
  }

  // parses all of the decorators out of a SAN string
  function stripped_san(move) {
    return move.replace(/=/, '').replace(/[+#]?[?!]*$/, '')
  }

  function attacked(color, square) {
    for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
      /* did we run off the end of the board */
      if (i & 0x88) {
        i += 7
        continue
      }

      /* if empty square or wrong color */
      if (board[i] == null || board[i].color !== color) continue

      var piece = board[i]
      var difference = i - square
      var index = difference + 119

      if (ATTACKS[index] & (1 << SHIFTS[piece.type])) {
        if (piece.type === PAWN) {
          if (difference > 0) {
            if (piece.color === WHITE) return true
          } else {
            if (piece.color === BLACK) return true
          }
          continue
        }

        /* if the piece is a knight or a king */
        if (piece.type === 'n' || piece.type === 'k') return true

        var offset = RAYS[index]
        var j = i + offset

        var blocked = false
        while (j !== square) {
          if (board[j] != null) {
            blocked = true
            break
          }
          j += offset
        }

        if (!blocked) return true
      }
    }

    return false
  }

  function king_attacked(color) {
    return attacked(swap_color(color), kings[color])
  }

  function in_check() {
    return king_attacked(turn)
  }

  function in_checkmate() {
    return in_check() && generate_moves().length === 0
  }

  function in_stalemate() {
    return !in_check() && generate_moves().length === 0
  }

  function insufficient_material() {
    var pieces = {}
    var bishops = []
    var num_pieces = 0
    var sq_color = 0

    for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
      sq_color = (sq_color + 1) % 2
      if (i & 0x88) {
        i += 7
        continue
      }

      var piece = board[i]
      if (piece) {
        pieces[piece.type] = piece.type in pieces ? pieces[piece.type] + 1 : 1
        if (piece.type === BISHOP) {
          bishops.push(sq_color)
        }
        num_pieces++
      }
    }

    /* k vs. k */
    if (num_pieces === 2) {
      return true
    } else if (
      /* k vs. kn .... or .... k vs. kb */
      num_pieces === 3 &&
      (pieces[BISHOP] === 1 || pieces[KNIGHT] === 1)
    ) {
      return true
    } else if (num_pieces === pieces[BISHOP] + 2) {
      /* kb vs. kb where any number of bishops are all on the same color */
      var sum = 0
      var len = bishops.length
      for (var i = 0; i < len; i++) {
        sum += bishops[i]
      }
      if (sum === 0 || sum === len) {
        return true
      }
    }

    return false
  }

  function in_threefold_repetition() {
    /* TODO: while this function is fine for casual use, a better
     * implementation would use a Zobrist key (instead of FEN). the
     * Zobrist key would be maintained in the make_move/undo_move functions,
     * avoiding the costly that we do below.
     */
    var moves = []
    var positions = {}
    var repetition = false

    while (true) {
      var move = undo_move()
      if (!move) break
      moves.push(move)
    }

    while (true) {
      /* remove the last two fields in the FEN string, they're not needed
       * when checking for draw by rep */
      var fen = generate_fen()
        .split(' ')
        .slice(0, 4)
        .join(' ')

      /* has the position occurred three or move times */
      positions[fen] = fen in positions ? positions[fen] + 1 : 1
      if (positions[fen] >= 3) {
        repetition = true
      }

      if (!moves.length) {
        break
      }
      make_move(moves.pop())
    }

    return repetition
  }

  function push(move) {
    history.push({
      move: move,
      kings: { b: kings.b, w: kings.w },
      turn: turn,
      castling: { b: castling.b, w: castling.w },
      ep_square: ep_square,
      half_moves: half_moves,
      move_number: move_number
    })
  }

  function make_move(move) {
    var us = turn
    var them = swap_color(us)
    push(move)

    board[move.to] = board[move.from]
    board[move.from] = null

    /* if ep capture, remove the captured pawn */
    if (move.flags & BITS.EP_CAPTURE) {
      if (turn === BLACK) {
        board[move.to - 16] = null
      } else {
        board[move.to + 16] = null
      }
    }

    /* if pawn promotion, replace with new piece */
    if (move.flags & BITS.PROMOTION) {
      board[move.to] = { type: move.promotion, color: us }
    }

    /* if we moved the king */
    if (board[move.to].type === KING) {
      kings[board[move.to].color] = move.to

      /* if we castled, move the rook next to the king */
      if (move.flags & BITS.KSIDE_CASTLE) {
        var castling_to = move.to - 1
        var castling_from = move.to + 1
        board[castling_to] = board[castling_from]
        board[castling_from] = null
      } else if (move.flags & BITS.QSIDE_CASTLE) {
        var castling_to = move.to + 1
        var castling_from = move.to - 2
        board[castling_to] = board[castling_from]
        board[castling_from] = null
      }

      /* turn off castling */
      castling[us] = ''
    }

    /* turn off castling if we move a rook */
    if (castling[us]) {
      for (var i = 0, len = ROOKS[us].length; i < len; i++) {
        if (
          move.from === ROOKS[us][i].square &&
          castling[us] & ROOKS[us][i].flag
        ) {
          castling[us] ^= ROOKS[us][i].flag
          break
        }
      }
    }

    /* turn off castling if we capture a rook */
    if (castling[them]) {
      for (var i = 0, len = ROOKS[them].length; i < len; i++) {
        if (
          move.to === ROOKS[them][i].square &&
          castling[them] & ROOKS[them][i].flag
        ) {
          castling[them] ^= ROOKS[them][i].flag
          break
        }
      }
    }

    /* if big pawn move, update the en passant square */
    if (move.flags & BITS.BIG_PAWN) {
      if (turn === 'b') {
        ep_square = move.to - 16
      } else {
        ep_square = move.to + 16
      }
    } else {
      ep_square = EMPTY
    }

    /* reset the 50 move counter if a pawn is moved or a piece is captured */
    if (move.piece === PAWN) {
      half_moves = 0
    } else if (move.flags & (BITS.CAPTURE | BITS.EP_CAPTURE)) {
      half_moves = 0
    } else {
      half_moves++
    }

/* ---------- Utils ---------- */
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function el(tag, attrs, children){
  var e = document.createElement(tag);
  attrs = attrs || {};
  for (var k in attrs){
    if (k === "class") e.className = attrs[k];
    else if (k === "html") e.innerHTML = attrs[k];
    else if (k.indexOf("on") === 0 && typeof attrs[k] === "function") e.addEventListener(k.slice(2), attrs[k]);
    else if (typeof attrs[k] === "boolean"){ if (attrs[k]) e.setAttribute(k, ""); }
    else e.setAttribute(k, attrs[k]);
  }
  (children || []).forEach(function(c){
    if (c === null || c === undefined) return;
    if (typeof c === "string") e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}
function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function showToast(msg){
  var t = el("div", {class:"toast"}, [msg]);
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2200);
}

/* ---------- Persistence ---------- */
function saveOpenings(){
  try{
    var json = JSON.stringify(openings, function(key,val){
      if (key === "parent") return undefined;
      return val;
    });
    window.localStorage.setItem(STORAGE_KEY, json);
  }catch(e){ console.error("Opslaan mislukt", e); showToast("Opslaan is mislukt"); }
}
function loadOpenings(){
  try{
    var raw = window.localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    var data = JSON.parse(raw);
    data.forEach(function(o){ linkParents(o.tree, null); });
    return data;
  }catch(e){ console.error("Laden mislukt", e); return []; }
}
function linkParents(node, parent){
  node.parent = parent;
  (node.children || []).forEach(function(c){ linkParents(c, node); });
}

/* ---------- Tree helpers ---------- */
function newOpeningObj(name){
  return {
    id: uid(),
    name: name || "Naamloze opening",
    trainColor: "w",
    createdAt: Date.now(),
    tree: { san: null, fen: START_FEN, children: [], parent: null, comment: "" }
  };
}
function cloneTreeNode(node, parent){
  var copy = { san: node.san, fen: node.fen, comment: node.comment || "", children: [], parent: parent || null };
  copy.children = (node.children || []).map(function(c){ return cloneTreeNode(c, copy); });
  return copy;
}
function buildTreeFromCurrentGame(){
  if (!freePlayTree || !freePlayTree.children || freePlayTree.children.length === 0) return null;
  return cloneTreeNode(freePlayTree, null);
}
function maxDepth(node){
  if (!node.children || node.children.length === 0) return 0;
  var m = 0;
  node.children.forEach(function(c){ m = Math.max(m, 1 + maxDepth(c)); });
  return m;
}
function nodeDepth(node){
  var d = 0, n = node;
  while (n.parent){ d++; n = n.parent; }
  return d;
}
function nodeCount(node){
  var c = 1;
  (node.children||[]).forEach(function(ch){ c += nodeCount(ch); });
  return c;
}
function getActiveOpening(){
  return openings.find(function(o){ return o.id === activeOpeningId; }) || null;
}

/* ---------- PGN parse ---------- */
function parsePGNToTree(pgnText){
  var comments = [];
  var text = pgnText
    .replace(/\[[^\]]*\]/g, " ")
    .replace(/\{([^}]*)\}/g, function(_, c){ comments.push(c.trim()); return " \u0001" + (comments.length-1) + "\u0001 "; })
    .replace(/\$\d+/g, " ")
    .replace(/\d+\.(\.\.)?/g, " ")
    .replace(/\(/g, " ( ")
    .replace(/\)/g, " ) ");
  var rawTokens = text.split(/\s+/).filter(Boolean);
  var tokens = rawTokens.filter(function(t){ return !/^(1-0|0-1|1\/2-1\/2|\*)$/.test(t); });

  var root = { san:null, fen: START_FEN, children: [], parent: null, comment: "" };

  function parseSeq(pos, startNode){
    var cur = startNode;
    var prev = null;
    while (pos < tokens.length){
      var t = tokens[pos];
      if (t === "("){
        var res = parseSeq(pos+1, prev || startNode);
        pos = res.pos;
        continue;
      }
      if (t === ")"){
        return { pos: pos+1, node: cur };
      }
      var commentMatch = /^\u0001(\d+)\u0001$/.exec(t);
      if (commentMatch){
        cur.comment = comments[parseInt(commentMatch[1],10)] || "";
        pos++;
        continue;
      }
      var tmp = new Chess(cur.fen);
      var mv = tmp.move(t, { sloppy: true });
      if (!mv){ pos++; continue; }
      var child = null;
      for (var i=0;i<cur.children.length;i++){ if (cur.children[i].san === mv.san){ child = cur.children[i]; break; } }
      if (!child){
        child = { san: mv.san, fen: tmp.fen(), children: [], parent: cur, comment: "" };
        cur.children.push(child);
      }
      prev = cur;
      cur = child;
      pos++;
    }
    return { pos: pos, node: cur };
  }
  parseSeq(0, root);
  return root;
}

/* ---------- PGN export ---------- */
function moveNumTag(ply, forceDots){
  var num = Math.floor(ply/2) + 1;
  if (ply % 2 === 0) return num + ". ";
  return forceDots ? (num + "... ") : "";
}
function sanWithComment(node){
  var c = (node.comment || "").trim();
  return node.san + (c ? " {" + c.replace(/[{}]/g,"") + "}" : "");
}
function buildMovetext(node, ply){
  if (!node.children || node.children.length === 0) return "";
  var main = node.children[0];
  var parts = [];
  parts.push(moveNumTag(ply, false) + sanWithComment(main));
  for (var i=1;i<node.children.length;i++){
    var alt = node.children[i];
    var inner = buildMovetext(alt, ply+1);
    parts.push("(" + moveNumTag(ply, true) + sanWithComment(alt) + (inner ? " " + inner : "") + ")");
  }
  var rest = buildMovetext(main, ply+1);
  if (rest) parts.push(rest);
  return parts.join(" ");
}
function openingToPGN(opening){
  var headers = '[Event "' + opening.name.replace(/"/g,"'") + '"]\n[Site "BlitzMeister"]\n[Result "*"]\n\n';
  var body = buildMovetext(opening.tree, 0);
  return headers + (body || "") + " *";
}

/* ----- Import modal (new opening from PGN) ----- */

function downloadAllOpenings(){
  if (openings.length === 0){ showToast("Je hebt nog geen openingen om te downloaden"); return; }
  var sorted = openings.slice().sort(function(a,b){return b.createdAt-a.createdAt;});
  var combined = sorted.map(function(o){ return openingToPGN(o); }).join("\n\n\n");
  var blob = new Blob([combined], {type:"application/x-chess-pgn"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "blitzmeister-openingen.pgn";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  showToast("Download gestart");
}

function triggerUpload(){
  var input = document.createElement("input");
  input.type = "file";
  input.accept = ".pgn,.txt,text/plain";
  input.style.display = "none";
  input.addEventListener("change", function(){
    var file = input.files && input.files[0];
    input.remove();
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e){ importCombinedPGN(e.target.result); };
    reader.onerror = function(){ showToast("Kon bestand niet lezen"); };
    reader.readAsText(file);
  });
  document.body.appendChild(input);
  input.click();
}
function importCombinedPGN(text){
  if (!text || !text.trim()){ showToast("Bestand is leeg"); return; }
  var blocks = text.split(/(?=\[Event\s)/i).map(function(b){ return b.trim(); }).filter(Boolean);
  if (blocks.length === 0) blocks = [text.trim()];
  var importedCount = 0;
  blocks.forEach(function(block, i){
    var tree;
    try{ tree = parsePGNToTree(block); }catch(e){ return; }
    if (!tree.children || tree.children.length === 0) return;
    var nameMatch = block.match(/\[Event\s+"([^"]*)"\]/i);
    var name = (nameMatch && nameMatch[1].trim()) ? nameMatch[1].trim() : "Ge\u00efmporteerde opening " + (i+1);
    var o = newOpeningObj(name);
    o.tree = tree;
    openings.push(o);
    importedCount++;
  });
  if (importedCount === 0){ showToast("Geen geldige openingen gevonden in dit bestand"); return; }
  saveOpenings();
  render();
  showToast(importedCount + " opening" + (importedCount===1?"":"en") + " ge\u00efmporteerd");
}

var dragCtx = null;

function renderBoardWrap(){

function appendEvalBarTo(container){
  var evalWrap = el("div",{class:"eval-bar-wrap", id:"eval-bar-wrap"});
  renderEvalBarInto(evalWrap);
  container.appendChild(evalWrap);
}
function renderEvalBarInto(wrap){
  clear(wrap);
  var wc = Math.max(0, Math.min(100, currentEval.winChance));
  var whiteSeg = el("div",{class:"eval-bar-white", style:"flex:"+wc+" 1 0;"});
  var blackSeg = el("div",{class:"eval-bar-black", style:"flex:"+(100-wc)+" 1 0;"});
  var scoreText;
  if (currentEval.mate !== null && currentEval.mate !== undefined){
    scoreText = "M" + Math.abs(currentEval.mate);
  } else {
    var e = currentEval.eval || 0;
    scoreText = (e > 0 ? "+" : "") + e.toFixed(1);
  }
  var label = el("div",{class:"eval-bar-score"},[scoreText]);
  // follows the actual board orientation: whichever color sits at the bottom leads on the left
  if (!boardFlipped){ wrap.appendChild(whiteSeg); wrap.appendChild(blackSeg); }
  else { wrap.appendChild(blackSeg); wrap.appendChild(whiteSeg); }
  wrap.appendChild(label);
}
function fetchEvalIfNeeded(){
  var fen = chess.fen();
  if (fen === lastEvalFen) return;
  lastEvalFen = fen;
  if (typeof fetch !== "function") return;
  var seq = ++evalRequestSeq;
  try{
    fetch("https://chess-api.com/v1", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fen: fen, depth: 12 })
    }).then(function(r){ return r.json(); }).then(function(data){
      if (seq !== evalRequestSeq) return; // a newer request superseded this one
      if (!data || typeof data.winChance !== "number") return;
      currentEval = { winChance: data.winChance, mate: data.mate, eval: data.eval };
      var wrap = document.getElementById("eval-bar-wrap");
      if (wrap) renderEvalBarInto(wrap);
    }).catch(function(){ /* offline or blocked: keep showing the last known bar */ });
  }catch(e){ /* fetch unsupported or blocked synchronously: keep neutral bar */ }
}
function buildBoardSquares(board){
  clear(board);
  var pos = chess.board(); // 8 rows, rank8..rank1, files a..h
  var rows = [];
  for (var r=0;r<8;r++) rows.push(r);
  var cols = [];
  for (var c=0;c<8;c++) cols.push(c);
  if (boardFlipped){ rows.reverse(); cols.reverse(); }

  rows.forEach(function(r){
    cols.forEach(function(c){
      var fileIdx = c;
      var rankNum = 8 - r;
      var squareName = FILES[fileIdx] + rankNum;
      var light = (fileIdx + rankNum) % 2 === 0;
      var sqEl = el("div",{class:"square " + (light ? "light":"dark"), "data-square": squareName});
      if (lastMove && (lastMove.from === squareName)) sqEl.classList.add("hi-from");
      if (lastMove && (lastMove.to === squareName)) sqEl.classList.add("hi-to");
      // coords
      if (c === (boardFlipped?7:0)){
        sqEl.appendChild(el("span",{class:"coord"},[String(rankNum)]));
      }
      if (r === (boardFlipped?0:7)){
        sqEl.appendChild(el("span",{class:"coord rank"},[FILES[fileIdx]]));
      }
      var piece = pos[r][c];
      if (piece){
        var pieceEl = el("span",{class:"piece " + (piece.color==="w"?"white":"black"), html: pieceSVG(piece.type, piece.color)});
        pieceEl.setAttribute("data-square", squareName);
        attachDragHandlers(pieceEl, squareName);
        sqEl.appendChild(pieceEl);
      }
      board.appendChild(sqEl);
    });
  });
}
function rerenderBoardOnly(){
  var board = document.getElementById("board");
  if (board) buildBoardSquares(board);
}

function isDraggable(square){
  if (freePlayMode) return !!chess.get(square) && chess.get(square).color === chess.turn();
  if (!activeOpeningId) return false;
  if (sessionEnded) return false;
  var piece = chess.get(square);
  if (!piece) return false;
  if (mode === "editor") return piece.color === chess.turn();
  if (chess.turn() !== trainColor) return false;
  return piece.color === trainColor;
}

function attachDragHandlers(pieceEl, square){
  pieceEl.addEventListener("pointerdown", function(ev){
    if (!isDraggable(square)) return;
    ev.preventDefault();
    var legal = chess.moves({ square: square, verbose:true });
    if (legal.length === 0) return;
    var boardEl = document.getElementById("board");
    var rect = pieceEl.getBoundingClientRect();
    dragCtx = {
      from: square,
      pieceEl: pieceEl,
      legal: legal,
      startX: ev.clientX,
      startY: ev.clientY,
      origLeft: rect.left + rect.width/2,
      origTop: rect.top + rect.height/2
    };
    pieceEl.setPointerCapture(ev.pointerId);
    pieceEl.classList.add("dragging");
    pieceEl.style.left = dragCtx.origLeft + "px";
    pieceEl.style.top = dragCtx.origTop + "px";
    highlightLegalTargets(legal, square);
  });
  pieceEl.addEventListener("pointermove", function(ev){
    if (!dragCtx || dragCtx.pieceEl !== pieceEl) return;
    ev.preventDefault();
    pieceEl.style.left = ev.clientX + "px";
    pieceEl.style.top = ev.clientY + "px";
  });
  pieceEl.addEventListener("pointerup", function(ev){
    if (!dragCtx || dragCtx.pieceEl !== pieceEl) return;
    ev.preventDefault();
    var targetEl = document.elementFromPoint(ev.clientX, ev.clientY);
    var sqEl = targetEl ? targetEl.closest(".square") : null;
    var toSquare = sqEl ? sqEl.getAttribute("data-square") : null;
    var legal = dragCtx.legal;
    var from = dragCtx.from;
    clearHighlights();
    dragCtx = null;
    if (toSquare){
      handleAttemptedMove(from, toSquare, legal);
    } else {
      rerenderBoardOnly();
    }
  });
  pieceEl.addEventListener("pointercancel", function(){
    dragCtx = null; clearHighlights(); rerenderBoardOnly();
  });
}
function highlightLegalTargets(legal, from){
  var board = document.getElementById("board");
  legal.forEach(function(m){
    var sqEl = board.querySelector('.square[data-square="'+m.to+'"]');
    if (!sqEl) return;
    var dot = el("div",{class: m.flags.indexOf("c")>=0 || m.flags.indexOf("e")>=0 ? "dot capture" : "dot"});
    sqEl.appendChild(dot);
  });
}
function clearHighlights(){
  document.querySelectorAll(".dot").forEach(function(d){ d.remove(); });
}

function handleAttemptedMove(from, to, legal){
  var matches = legal.filter(function(m){ return m.to === to; });
  if (matches.length === 0){ rerenderBoardOnly(); return; }
  if (matches[0].flags.indexOf("p") >= 0){
    askPromotion(chess.turn()).then(function(piece){
      finalizeMove(from, to, piece);
    });
  } else {
    finalizeMove(from, to, null);
  }
}
function finalizeMove(from, to, promotion){
  var moveResult = chess.move({ from: from, to: to, promotion: promotion || "q" });
  if (!moveResult){ rerenderBoardOnly(); return; }
  lastMove = { from: from, to: to };
  if (freePlayMode || mode === "editor") processEditorMove(moveResult);
  else processPracticeMove(moveResult, to);
}

function askPromotion(color){
  return new Promise(function(resolve){
    var overlay = el("div",{class:"modal-overlay center"});
    var opts = ["q","r","b","n"];
    var choices = el("div",{class:"promo-choices"});
    opts.forEach(function(p){
      choices.appendChild(el("button",{class:"piece " + (color==="w"?"white":"black"), html: pieceSVG(p, color), onclick:function(){ overlay.remove(); resolve(p); }}));
    });
    var sheet = el("div",{class:"modal-sheet"},[
      el("div",{class:"modal-title"},["Promoveer naar\u2026"]),
      choices
    ]);
    overlay.appendChild(sheet);
    document.body.appendChild(overlay);
  });
}

/* ---------- Editor logic ---------- */
function processEditorMove(moveResult){
  var child = null;
  for (var i=0;i<currentNode.children.length;i++){
    if (currentNode.children[i].san === moveResult.san){ child = currentNode.children[i]; break; }
  }
  if (!child){
    child = { san: moveResult.san, fen: chess.fen(), children: [], parent: currentNode, comment: "" };
    currentNode.children.push(child);
  }
  currentNode = child;
  saveOpenings();
  render();
}
function editorStepBack(){
  if (!currentNode.parent) return;
  currentNode = currentNode.parent;
  chess.load(currentNode.fen);
  lastMove = null;
  render();
}
function editorDeleteHere(){
  if (!currentNode.parent) return;
  var parent = currentNode.parent;
  var toRemove = currentNode;
  parent.children = parent.children.filter(function(c){ return c !== toRemove; });
  currentNode = parent;
  chess.load(currentNode.fen);
  lastMove = null;
  saveOpenings();
  render();
}

/* ---------- Practice logic ---------- */
function processPracticeMove(moveResult, to){
  var match = null;
  for (var i=0;i<currentNode.children.length;i++){
    if (currentNode.children[i].san === moveResult.san){ match = currentNode.children[i]; break; }
  }
  if (match){
    stats.correct++;
    currentNode = match;
    render();
    flashSquare(to, true);
    if (currentNode.children.length === 0){
      sessionEnded = true;
      handleSessionComplete();
    } else {
      maybeAutoPlayOpponent();
    }
  } else {
    stats.incorrect++;
    chess.undo();
    lastMove = null;
    render();
    flashSquare(to, false);
  }
}
function flashSquare(square, correct){
  var sqEl = document.querySelector('.square[data-square="'+square+'"]');
  if (!sqEl) return;
  sqEl.classList.add(correct ? "flash-correct" : "flash-incorrect");
  setTimeout(function(){ sqEl.classList.remove("flash-correct","flash-incorrect"); }, 500);
}
function maybeAutoPlayOpponent(){
  if (!currentNode || currentNode.children.length === 0) return;
  if (chess.turn() === trainColor) return;
  setTimeout(function(){
    if (mode !== "practice") return;
    var opts = currentNode.children;
    var pick = opts[Math.floor(Math.random()*opts.length)];
    var mv = chess.move(pick.san);
    if (!mv) return;
    lastMove = { from: mv.from, to: mv.to };
    currentNode = pick;
    if (currentNode.children.length === 0){
      sessionEnded = true;
      handleSessionComplete();
    } else {
      render();
    }
  }, 550);
}

/* ---------- Moves table ---------- */
function renderMovesSection(o){
  var section = el("div",{class:"moves-section"});
  var header = el("div",{class:"moves-header" + (movesOpen ? " open":"")},[
    el("span",{},["Zetten"]),
    el("span",{class:"chev"},["\u25BC"])
  ]);
  header.addEventListener("click", function(){
    movesOpen = !movesOpen;
    header.classList.toggle("open", movesOpen);
    body.classList.toggle("open", movesOpen);
  });
  var body = el("div",{class:"moves-body" + (movesOpen ? " open":"")});
  var inner = el("div",{class:"moves-body-inner"});
  appendEvalBarTo(inner);
  if (!o.tree.children || o.tree.children.length === 0){
    inner.appendChild(el("div",{class:"no-moves"},["Nog geen zetten opgeslagen."]));
  } else {
    inner.appendChild(buildMoveTreeDom(o.tree, 0));
  }
  body.appendChild(inner);
  section.appendChild(header);
  section.appendChild(body);
  return section;
}
function renderFreePlayMovesSection(){
  var section = el("div",{class:"moves-section"});
  var header = el("div",{class:"moves-header" + (movesOpen ? " open":"")},[
    el("span",{},["Zetten"]),
    el("span",{class:"chev"},["\u25BC"])
  ]);
  header.addEventListener("click", function(){
    movesOpen = !movesOpen;
    header.classList.toggle("open", movesOpen);
    body.classList.toggle("open", movesOpen);
  });
  var body = el("div",{class:"moves-body" + (movesOpen ? " open":"")});
  var inner = el("div",{class:"moves-body-inner"});
  appendEvalBarTo(inner);
  if (!freePlayTree.children || freePlayTree.children.length === 0){
    inner.appendChild(el("div",{class:"no-moves"},["Nog geen zetten gespeeld."]));
  } else {
    inner.appendChild(buildMoveTreeDom(freePlayTree, 0));
  }
  body.appendChild(inner);
  section.appendChild(header);
  section.appendChild(body);
  return section;
}
function buildMoveTreeDom(node, ply){
  var frag = document.createDocumentFragment();
  if (!node.children || node.children.length === 0) return frag;
  var main = node.children[0];
  frag.appendChild(makeMoveSpan(main, ply));
  for (var i=1;i<node.children.length;i++){
    var alt = node.children[i];
    var subtree = buildMoveTreeDom(alt, ply+1);
    var wrap = el("span",{class:"variation"});
    wrap.appendChild(document.createTextNode(" ("));
    wrap.appendChild(makeMoveSpan(alt, ply, true));
    wrap.appendChild(document.createTextNode(" "));
    wrap.appendChild(subtree);
    wrap.appendChild(document.createTextNode(") "));
    frag.appendChild(wrap);
  }
  frag.appendChild(document.createTextNode(" "));
  frag.appendChild(buildMoveTreeDom(main, ply+1));
  return frag;
}
function makeMoveSpan(node, ply, forceDots){
  var num = Math.floor(ply/2)+1;
  var prefix = (ply % 2 === 0) ? (num + ". ") : (forceDots ? (num + "... ") : "");
  var group = el("span",{class:"mv-group"});
  var isBlackMove = (ply % 2 === 1);
  var span = el("span",{class:"mv" + (isBlackMove ? " mv-black" : "") + (node===currentNode ? " current":"")},[prefix + node.san]);
  span.addEventListener("click", function(){
    currentNode = node;
    chess.load(node.fen);
    lastMove = null;
    render();
  });
  var hasComment = !!(node.comment && node.comment.trim());
  var icon = el("span",{class:"mv-comment-icon" + (hasComment ? " has-comment" : ""), title:"Toelichting"},["\uD83D\uDCAC"]);
  icon.addEventListener("click", function(ev){
    ev.stopPropagation();
    openCommentModal(node);
  });
  group.appendChild(span);
  group.appendChild(icon);
  return group;
}
function openCommentModal(node){
  var overlay = el("div",{class:"modal-overlay center"});
  var textarea = el("textarea",{class:"text-input", placeholder:"Toelichting bij deze zet\u2026"});
  textarea.value = node.comment || "";
  textarea.style.minHeight = "90px";
  var sheet = el("div",{class:"modal-sheet"},[
    el("div",{class:"modal-title"},["Toelichting \u2014 " + node.san]),
    textarea,
    el("div",{class:"modal-actions"},[
      el("button",{class:"btn", style:"flex:1;", onclick:function(){ overlay.remove(); }},["Annuleren"]),
      el("button",{class:"btn btn-primary", style:"flex:1;", onclick:function(){
        node.comment = textarea.value.trim();
        if (activeOpeningId) saveOpenings();
        overlay.remove();
        render();
      }},["Opslaan"])
    ])
  ]);
  overlay.appendChild(sheet);
  document.body.appendChild(overlay);
  setTimeout(function(){ textarea.focus(); }, 50);
}

/* ---------- Free play (Schaken) ---------- */
function startFreePlay(){
  freePlayMode = true;
  practiceAllMode = false;
  drawerOpen = false;
  activeOpeningId = null;
  freePlayTree = { san: null, fen: START_FEN, children: [], parent: null, comment: "" };
  currentNode = freePlayTree;
  chess.reset();
  boardFlipped = false;
  lastMove = null;
  movesOpen = false;
  render();
}
function restoreLastOpening(){
  if (openings.length === 0){
    activeOpeningId = null;
    currentNode = null;
    chess.reset();
    boardFlipped = false;
    return;
  }
  var sorted = openings.slice().sort(function(a,b){
    return (b.lastOpenedAt || b.createdAt) - (a.lastOpenedAt || a.createdAt);
  });
  var o = sorted[0];
  activeOpeningId = o.id;
  trainColor = o.trainColor || "w";
  mode = nodeCount(o.tree) > 1 ? "practice" : "editor";
  currentNode = o.tree;
  chess.load(o.tree.fen);
  boardFlipped = (trainColor === "b");
}

/* ================= INIT ================= */
openings = loadOpenings();
freePlayMode = true;
activeOpeningId = null;
freePlayTree = { san: null, fen: START_FEN, children: [], parent: null, comment: "" };
currentNode = freePlayTree;
chess.reset();
boardFlipped = false;
render();

})();
